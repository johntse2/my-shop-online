<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机展示4款产品</title>
    <style>
        /* 简单样式美化，可根据需求修改 */
        .product-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            justify-content: center;
        }
        .product-item {
            width: 200px;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .product-img {
            width: 100%;
            height: 120px;
            background-color: #f5f5f5;
            border-radius: 4px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }
        .product-name {
            font-size: 14px;
            margin: 10px 0;
        }
        .product-price {
            color: #e63946;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2 style="text-align: center;">随机推荐4款产品</h2>
    <!-- 产品展示容器，JS会动态插入内容 -->
    <div class="product-container" id="productWrapper"></div>

    <script>
        // 1. 模拟42款产品的原始数据（实际项目中可替换为后端接口返回的数组）
        const allProducts = Array.from({ length: 42 }, (_, index) => ({
            id: index + 1, // 产品唯一ID（关键，用于判重）
            name: `产品${index + 1}`,
            price: (Math.floor(Math.random() * 900) + 100).toFixed(2), // 随机价格100-999
            desc: `这是产品${index + 1}的简介` // 产品简介
        }));

        // 2. 核心方法：从数组中随机抽取指定数量的不重复元素
        function getRandomUniqueItems(arr, count) {
            // 深拷贝原数组，避免修改原始数据（重要，防止原数组被打乱）
            const copyArr = [...arr];
            const result = [];
            // 循环抽取，直到达到指定数量或数组为空
            for (let i = 0; i < count; i++) {
                // 生成0到当前数组长度-1的随机索引
                const randomIndex = Math.floor(Math.random() * copyArr.length);
                // 从拷贝数组中删除并获取该索引的元素，加入结果集
                const randomItem = copyArr.splice(randomIndex, 1)[0];
                result.push(randomItem);
            }
            return result;
        }

        // 3. 抽取4款不重复产品
        const random4Products = getRandomUniqueItems(allProducts, 4);

        // 4. 动态生成HTML并渲染到页面
        function renderProducts(products) {
            const wrapper = document.getElementById('productWrapper');
            // 遍历抽取的产品，拼接HTML字符串（高效渲染少量元素）
            const productHtml = products.map(product => `
                <div class="product-item" data-product-id="${product.id}">
                    <div class="product-img">产品图${product.id}</div>
                    <h3 class="product-name">${product.name}</h3>
                    <p class="product-desc">${product.desc}</p>
                    <p class="product-price">¥${product.price}</p>
                </div>
            `).join(''); // 拼接为完整HTML字符串，避免多次DOM操作
            wrapper.innerHTML = productHtml;
        }

        // 执行渲染
        renderProducts(random4Products);
    </script>
</body>
</html>
